<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📱 Partes de Trabajo Móvil - Offline</title>
    <meta name="description" content="App móvil offline para partes diarios de trabajo. Funciona sin internet, envío directo por WhatsApp o Email">
    <meta name="keywords" content="parte diario, trabajo, dictado voz, construcción, mantenimiento, móvil, offline">
    <meta name="author" content="Michel Soler">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React y Babel -->
    <script crossorigin src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* Mejoras para móvil */
        @media (max-width: 640px) {
            /* Área táctil mejorada */
            button {
                min-height: 44px;
                touch-action: manipulation;
            }

            /* Inputs optimizados para móvil */
            input, textarea, select {
                font-size: 16px; /* Evita zoom en iOS */
                padding: 12px;
            }
        }

        /* Estilos para dictado por voz */
        .voice-active {
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
            border-color: #ef4444 !important;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        /* Scrollbar personalizado */
        .custom-scroll::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 4px;
        }
        .custom-scroll::-webkit-scrollbar-thumb:hover {
            background: #a1a1a1;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const PartesDiarioApp = () => {
            const [currentStep, setCurrentStep] = useState(0);
            const [formData, setFormData] = useState({
                fecha: new Date().toISOString().split('T')[0],
                nombreTrabajo: '',
                operarios: [{ nombre: '', horas: '' }],
                trabajosRealizados: '',
                materialesUtilizados: '',
                incidencias: '',
                observaciones: '',
                tareasPendientes: '',
                imagenes: [],
                albaranes: [],
                resumenInteligente: ''
            });

            // Estados para configuración móvil
            const [userEmail, setUserEmail] = useState('');
            const [userWhatsApp, setUserWhatsApp] = useState('');
            const [sendMethod, setSendMethod] = useState('email'); // 'email' o 'whatsapp'

            // Estados de la UI
            const [showSettings, setShowSettings] = useState(false);
            const [showHistory, setShowHistory] = useState(false);
            const [partesHistory, setPartesHistory] = useState([]);
            const [saveStatus, setSaveStatus] = useState('');
            const [isListening, setIsListening] = useState(false);
            const [currentField, setCurrentField] = useState('');
            const [maxPartesLimit, setMaxPartesLimit] = useState(50);
            const [currentOperarioIndex, setCurrentOperarioIndex] = useState(0);

            const recognitionRef = useRef(null);
            const currentFieldRef = useRef('');

            // Cargar configuración al inicializar
            useEffect(() => {
                loadSavedData();
                loadHistoryData();

                const savedUserEmail = localStorage.getItem('user_email');
                if (savedUserEmail) setUserEmail(savedUserEmail);

                const savedUserWhatsApp = localStorage.getItem('user_whatsapp');
                if (savedUserWhatsApp) setUserWhatsApp(savedUserWhatsApp);

                const savedSendMethod = localStorage.getItem('send_method');
                if (savedSendMethod) setSendMethod(savedSendMethod);

                const savedLimit = localStorage.getItem('max_partes_limit');
                if (savedLimit) setMaxPartesLimit(parseInt(savedLimit));

                // Inicializar reconocimiento de voz
                console.log('🔍 Verificando soporte de reconocimiento de voz...');
                if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                    console.log('✅ Reconocimiento de voz soportado');
                    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                    recognitionRef.current = new SpeechRecognition();
                    recognitionRef.current.continuous = true;
                    recognitionRef.current.interimResults = true;
                    recognitionRef.current.lang = 'es-ES';
                    console.log('✅ Configuración de voz completada');

                    recognitionRef.current.onresult = (event) => {
                        console.log('🎤 onresult disparado, event:', event);
                        console.log('🎤 resultIndex:', event.resultIndex, 'results.length:', event.results.length);

                        let finalTranscript = '';
                        let interimTranscript = '';

                        for (let i = event.resultIndex; i < event.results.length; i++) {
                            const transcript = event.results[i][0].transcript;
                            console.log(`🎤 Result ${i}: "${transcript}", isFinal:`, event.results[i].isFinal);

                            if (event.results[i].isFinal) {
                                finalTranscript += transcript;
                            } else {
                                interimTranscript += transcript;
                            }
                        }

                        console.log('🎤 finalTranscript:', finalTranscript);
                        console.log('🎤 interimTranscript:', interimTranscript);
                        console.log('🎤 currentField (estado):', currentField);
                        console.log('🎤 currentFieldRef.current:', currentFieldRef.current);

                        // Actualizar con cualquier transcripción disponible
                        const textToProcess = finalTranscript || interimTranscript;
                        const fieldToUse = currentFieldRef.current || currentField;

                        if (textToProcess && textToProcess.trim() && fieldToUse) {
                            console.log('🎤 LLAMANDO handleVoiceInput con:', fieldToUse, textToProcess.trim());
                            handleVoiceInput(fieldToUse, textToProcess.trim());
                        } else {
                            console.log('❌ No se puede procesar - textToProcess:', textToProcess, 'fieldToUse:', fieldToUse);
                        }
                    };

                    recognitionRef.current.onstart = () => {
                        console.log('🎤 Reconocimiento iniciado correctamente');
                    };

                    recognitionRef.current.onend = () => {
                        setIsListening(false);
                        setCurrentField('');
                        currentFieldRef.current = '';
                    };

                    recognitionRef.current.onerror = (event) => {
                        console.error('Error de reconocimiento de voz:', event.error);
                        setIsListening(false);
                        setCurrentField('');
                        currentFieldRef.current = '';
                    };
                } else {
                    console.error('❌ Reconocimiento de voz NO soportado en este navegador');
                    alert('❌ Tu navegador no soporta reconocimiento de voz\n\n✅ Navegadores compatibles:\n• Chrome\n• Edge\n• Safari (iOS)\n\n❌ No funciona en:\n• Firefox\n• Modo incógnito (algunas versiones)');
                }

                return () => {
                    if (recognitionRef.current) {
                        recognitionRef.current.stop();
                    }
                };
            }, []);

            // Función para guardar configuración móvil
            const saveMobileConfig = (email, whatsapp, method) => {
                setUserEmail(email);
                setUserWhatsApp(whatsapp);
                setSendMethod(method);
                localStorage.setItem('user_email', email);
                localStorage.setItem('user_whatsapp', whatsapp);
                localStorage.setItem('send_method', method);
            };

            // Función para enviar por Email
            const sendByEmail = async () => {
                if (!userEmail.trim()) {
                    alert('⚠️ Configura tu email primero en la sección de configuración');
                    return false;
                }

                try {
                    // Primero generar el PDF
                    await exportToPDF();

                    // Preparar resumen del parte
                    const totalHoras = formData.operarios?.reduce((sum, op) => sum + (parseFloat(op.horas) || 0), 0) || 0;
                    const fechaFormateada = new Date(formData.fecha).toLocaleDateString('es-ES');

                    const resumenEmail = `
📋 PARTE DIARIO DE TRABAJO
━━━━━━━━━━━━━━━━━━━━━━━━━━

🏗️ Proyecto: ${formData.nombreTrabajo}
📅 Fecha: ${fechaFormateada}
⏰ Total Horas: ${totalHoras}h
👷 Operarios: ${formData.operarios?.length || 0}

📝 TRABAJOS REALIZADOS:
${formData.trabajosRealizados || 'Sin especificar'}

📦 MATERIALES:
${formData.materialesUtilizados || 'Sin especificar'}

${formData.incidencias ? `⚠️ INCIDENCIAS:\n${formData.incidencias}\n` : ''}
${formData.observaciones ? `💡 OBSERVACIONES:\n${formData.observaciones}\n` : ''}
${formData.tareasPendientes ? `📋 TAREAS PENDIENTES:\n${formData.tareasPendientes}\n` : ''}

📊 ARCHIVOS ADJUNTOS:
📷 Imágenes: ${formData.imagenes?.length || 0}
📄 Documentos: ${formData.albaranes?.length || 0}

━━━━━━━━━━━━━━━━━━━━━━━━━━
📱 Enviado desde App Móvil de Partes
`;

                    // Crear enlace mailto
                    const subject = `Parte Diario - ${formData.nombreTrabajo} - ${fechaFormateada}`;
                    const body = encodeURIComponent(resumenEmail);
                    const mailtoLink = `mailto:${userEmail}?subject=${encodeURIComponent(subject)}&body=${body}`;

                    // Abrir cliente de email
                    window.open(mailtoLink, '_self');

                    alert('📧 Email preparado\n\n✅ Se ha abierto tu cliente de email\n📄 No olvides adjuntar el archivo PDF descargado\n💾 El parte se ha guardado localmente');

                    // Guardar en historial local
                    saveToHistory();

                    // Crear nuevo parte
                    createNewParte();

                    return true;

                } catch (error) {
                    console.error('Error enviando email:', error);
                    alert('❌ Error preparando email\n\n' + error.message + '\n\nPero el parte se ha guardado localmente.');
                    return false;
                }
            };

            // Función para enviar por WhatsApp
            const sendByWhatsApp = async () => {
                if (!userWhatsApp.trim()) {
                    alert('⚠️ Configura tu WhatsApp primero en la sección de configuración');
                    return false;
                }

                try {
                    // Primero generar el PDF
                    await exportToPDF();

                    // Preparar resumen del parte para WhatsApp (más conciso)
                    const totalHoras = formData.operarios?.reduce((sum, op) => sum + (parseFloat(op.horas) || 0), 0) || 0;
                    const fechaFormateada = new Date(formData.fecha).toLocaleDateString('es-ES');

                    const resumenWhatsApp = `🏗️ *PARTE DIARIO*

📋 *${formData.nombreTrabajo}*
📅 ${fechaFormateada} | ⏰ ${totalHoras}h | 👷 ${formData.operarios?.length || 0} operarios

🔧 *Trabajos:*
${formData.trabajosRealizados || 'Sin especificar'}

📦 *Materiales:*
${formData.materialesUtilizados || 'Sin especificar'}

${formData.incidencias ? `⚠️ *Incidencias:*\n${formData.incidencias}\n` : ''}
${formData.observaciones ? `💡 *Observaciones:*\n${formData.observaciones}\n` : ''}
${formData.tareasPendientes ? `📋 *Pendientes:*\n${formData.tareasPendientes}\n` : ''}

📊 Adjuntos: ${formData.imagenes?.length || 0} fotos, ${formData.albaranes?.length || 0} docs

📄 *PDF descargado automáticamente para adjuntar*

📱 _Enviado desde App Móvil_`;

                    // Limpiar número de WhatsApp (quitar espacios, guiones, etc.)
                    const cleanNumber = userWhatsApp.replace(/[^\d+]/g, '');

                    // Crear enlace de WhatsApp
                    const whatsappLink = `https://wa.me/${cleanNumber}?text=${encodeURIComponent(resumenWhatsApp)}`;

                    // Abrir WhatsApp
                    window.open(whatsappLink, '_blank');

                    alert('📱 WhatsApp abierto con envío completo\n\n✅ Se ha preparado el mensaje\n📄 El PDF se ha descargado automáticamente\n📎 Adjunta también el archivo PDF descargado\n💾 El parte se ha guardado localmente');

                    // Guardar en historial local
                    saveToHistory();

                    // Crear nuevo parte
                    createNewParte();

                    return true;

                } catch (error) {
                    console.error('Error enviando WhatsApp:', error);
                    alert('❌ Error preparando WhatsApp\n\n' + error.message + '\n\nPero el parte se ha guardado localmente.');
                    return false;
                }
            };

            // Función unificada de envío
            const sendParte = async () => {
                if (sendMethod === 'email') {
                    return await sendByEmail();
                } else if (sendMethod === 'whatsapp') {
                    return await sendByWhatsApp();
                } else {
                    alert('⚠️ Selecciona un método de envío en la configuración');
                    return false;
                }
            };

            // Función para convertir archivos a base64
            const convertToBase64 = (file) => {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.readAsDataURL(file);
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = error => reject(error);
                });
            };

            // Funciones de guardado y carga
            const loadSavedData = () => {
                try {
                    const saved = localStorage.getItem('parte_diario_current');
                    if (saved) {
                        const data = JSON.parse(saved);
                        setFormData(data);
                        setSaveStatus('loaded');
                    }

                    let currentId = localStorage.getItem('parte_diario_current_id');
                    if (!currentId) {
                        const newId = 'parte_' + Date.now();
                        localStorage.setItem('parte_diario_current_id', newId);
                    }
                } catch (error) {
                    console.error('Error cargando datos:', error);
                    setSaveStatus('error');
                }
            };

            const loadHistoryData = () => {
                try {
                    const history = localStorage.getItem('partes_diarios_history');
                    if (history) {
                        setPartesHistory(JSON.parse(history));
                    }
                } catch (error) {
                    console.error('Error cargando historial:', error);
                }
            };

            // Función para limpiar los últimos N partes del historial
            const cleanLastPartes = (count = 5) => {
                try {
                    console.log('🗑️ Intentando limpiar historial. Total partes:', partesHistory.length);

                    if (partesHistory.length === 0) {
                        alert('ℹ️ No hay partes en el historial para eliminar\n\nPrimero crea y guarda algunos partes para poder gestionar el historial.');
                        return 0;
                    }

                    const totalPartes = partesHistory.length;
                    const partesToDelete = Math.min(count, totalPartes);

                    console.log('📊 Total partes:', totalPartes, 'A eliminar:', partesToDelete);

                    if (partesToDelete === 0) {
                        alert('ℹ️ No hay partes para eliminar');
                        return 0;
                    }

                    // Confirmar antes de eliminar
                    const confirmMessage = `⚠️ ¿Eliminar los últimos ${partesToDelete} parte(s) del historial?\n\nTotal actual: ${totalPartes} partes\nQuedarán: ${totalPartes - partesToDelete} partes\n\nEsto liberará memoria del navegador.\n\nEsta acción no se puede deshacer.`;

                    if (confirm(confirmMessage)) {
                        // Mantener solo los partes más antiguos (eliminar los últimos)
                        const remainingPartes = partesHistory.slice(0, totalPartes - partesToDelete);

                        console.log('🔄 Actualizando historial. Antes:', partesHistory.length, 'Después:', remainingPartes.length);

                        setPartesHistory(remainingPartes);
                        localStorage.setItem('partes_diarios_history', JSON.stringify(remainingPartes));

                        alert(`✅ Eliminados ${partesToDelete} parte(s) del historial\n\nAntes: ${totalPartes} partes\nAhora: ${remainingPartes.length} partes\n\n💾 Memoria liberada: ~${(partesToDelete * 50).toFixed(0)}KB aproximadamente`);
                        return partesToDelete;
                    }

                    return 0;
                } catch (error) {
                    console.error('Error limpiando partes del historial:', error);
                    alert('❌ Error al limpiar el historial: ' + error.message);
                    return 0;
                }
            };

            // Auto-save cada 2 segundos
            useEffect(() => {
                const timeoutId = setTimeout(() => {
                    try {
                        setSaveStatus('saving');
                        localStorage.setItem('parte_diario_current', JSON.stringify(formData));
                        setSaveStatus('saved');
                    } catch (error) {
                        console.error('Error guardando:', error);
                        setSaveStatus('error');
                    }
                }, 2000);

                return () => clearTimeout(timeoutId);
            }, [formData]);

            // Funciones de historial
            const saveToHistory = () => {
                try {
                    const currentId = localStorage.getItem('parte_diario_current_id') || 'parte_' + Date.now();
                    const parteToSave = {
                        id: currentId,
                        ...formData,
                        fechaCreacion: new Date().toISOString(),
                        ultimaModificacion: new Date().toISOString(),
                        completado: true
                    };

                    const updatedHistory = [...partesHistory];
                    const existingIndex = updatedHistory.findIndex(p => p.id === currentId);

                    if (existingIndex >= 0) {
                        updatedHistory[existingIndex] = parteToSave;
                    } else {
                        updatedHistory.unshift(parteToSave);
                    }

                    // Mantener solo los últimos maxPartesLimit
                    const limitedHistory = updatedHistory.slice(0, maxPartesLimit);

                    setPartesHistory(limitedHistory);
                    localStorage.setItem('partes_diarios_history', JSON.stringify(limitedHistory));

                    createNewParte();
                    return true;
                } catch (error) {
                    console.error('Error guardando en historial:', error);
                    return false;
                }
            };

            const createNewParte = () => {
                const newId = 'parte_' + Date.now();
                localStorage.setItem('parte_diario_current_id', newId);

                const newFormData = {
                    fecha: new Date().toISOString().split('T')[0],
                    nombreTrabajo: '',
                    operarios: [{ nombre: '', horas: '' }],
                    trabajosRealizados: '',
                    materialesUtilizados: '',
                    incidencias: '',
                    observaciones: '',
                    tareasPendientes: '',
                    imagenes: [],
                    albaranes: [],
                    resumenInteligente: ''
                };

                setFormData(newFormData);
                setCurrentStep(0);
                setCurrentOperarioIndex(0); // Resetear índice de operario
                localStorage.removeItem('parte_diario_current');
            };

            // Funciones de UI
            const handleInputChange = (field, value) => {
                setFormData(prev => ({ ...prev, [field]: value }));
            };

            const addOperario = () => {
                const lastOperario = formData.operarios[currentOperarioIndex];

                // Validar que el operario actual esté completo
                if (!lastOperario?.nombre.trim() || !lastOperario?.horas) {
                    alert('⚠️ Por favor completa el nombre y las horas del operario actual');
                    return;
                }

                // Agregar nuevo operario vacío
                setFormData(prev => ({
                    ...prev,
                    operarios: [...prev.operarios, { nombre: '', horas: '' }]
                }));

                // Actualizar índice para el siguiente operario
                setCurrentOperarioIndex(prev => prev + 1);

                // Mostrar confirmación
                alert(`✅ Operario "${lastOperario.nombre}" añadido correctamente`);
            };

            const updateOperario = (index, field, value) => {
                setFormData(prev => ({
                    ...prev,
                    operarios: prev.operarios.map((op, i) =>
                        i === index ? { ...op, [field]: value } : op
                    )
                }));
            };

            const removeOperario = (index) => {
                if (formData.operarios.length > 1) {
                    setFormData(prev => ({
                        ...prev,
                        operarios: prev.operarios.filter((_, i) => i !== index)
                    }));
                }
            };

            // Funciones de voz
            const startVoiceRecognition = (fieldName) => {
                console.log('🎤 startVoiceRecognition llamado con fieldName:', fieldName);

                if (!recognitionRef.current) {
                    console.log('❌ recognitionRef.current es null');
                    alert('Tu navegador no soporta reconocimiento de voz');
                    return;
                }

                // Si ya está escuchando en el mismo campo, NO detener - continuar dictando
                if (isListening && currentField === fieldName) {
                    console.log('🎤 Continuando dictado en el mismo campo:', fieldName);

                    // Solo reiniciar si el reconocimiento se ha detenido
                    if (recognitionRef.current.state === 'inactive') {
                        console.log('🔄 Reconocimiento inactivo, reiniciando...');
                        try {
                            recognitionRef.current.start();
                            console.log('✅ Reconocimiento reiniciado para continuar');
                        } catch (error) {
                            console.error('❌ Error reiniciando reconocimiento:', error);
                        }
                    }
                    return;
                }

                console.log('🎤 Deteniendo reconocimiento previo...');
                // Detener cualquier reconocimiento previo solo si es diferente campo
                try {
                    recognitionRef.current.stop();
                } catch (e) {
                    console.log('🎤 No había reconocimiento corriendo');
                }

                console.log('🎤 Configurando estados...');
                setIsListening(true);
                setCurrentField(fieldName);
                currentFieldRef.current = fieldName;
                console.log('🎤 Estados configurados - isListening: true, currentField:', fieldName);

                // Esperar un momento antes de iniciar
                setTimeout(() => {
                    console.log('🎤 Iniciando reconocimiento...');
                    try {
                        recognitionRef.current.start();
                        console.log('✅ recognitionRef.current.start() ejecutado');
                    } catch (error) {
                        console.error('❌ Error al iniciar reconocimiento:', error);
                        setIsListening(false);
                        setCurrentField('');
                    }
                }, 100);
            };

            const stopVoiceRecognition = () => {
                if (recognitionRef.current) {
                    recognitionRef.current.stop();
                    setIsListening(false);
                    setCurrentField('');
                }
            };

            const handleVoiceInput = (fieldName, transcript) => {
                console.log('📝 INICIO handleVoiceInput - fieldName:', fieldName, 'transcript:', transcript);

                if (!fieldName) {
                    console.log('❌ fieldName está vacío!');
                    return;
                }

                if (!transcript) {
                    console.log('❌ transcript está vacío!');
                    return;
                }

                try {
                    if (fieldName.includes('operario-')) {
                        console.log('📝 Procesando campo de operario:', fieldName);
                        const [, index, field] = fieldName.split('-');
                        const operarioIndex = parseInt(index);
                        console.log('📝 operarioIndex:', operarioIndex, 'field:', field);

                        if (formData.operarios[operarioIndex]) {
                            const currentValue = formData.operarios[operarioIndex][field] || '';
                            const newValue = currentValue ? currentValue + ' ' + transcript : transcript;
                            console.log('📝 Actualizando operario - currentValue:', currentValue, 'newValue:', newValue);
                            updateOperario(operarioIndex, field, newValue);
                            console.log('✅ Operario actualizado');
                        } else {
                            console.log('❌ Operario no encontrado en index:', operarioIndex);
                        }
                    } else {
                        console.log('📝 Procesando campo normal:', fieldName);
                        const currentValue = formData[fieldName] || '';
                        const newValue = currentValue ? currentValue + ' ' + transcript : transcript;
                        console.log('📝 Actualizando campo - currentValue:', currentValue, 'newValue:', newValue);
                        handleInputChange(fieldName, newValue);
                        console.log('✅ Campo actualizado');
                    }
                } catch (error) {
                    console.error('❌ ERROR en handleVoiceInput:', error);
                }
            };

            // Componente de botón de voz
            const VoiceButton = ({ fieldName }) => {
                const isActiveField = isListening && currentField === fieldName;

                // Determinar el texto del botón basado en si hay contenido
                const getButtonText = () => {
                    if (isActiveField) {
                        return '🔴 Parar';
                    }

                    // Verificar si el campo tiene contenido para mostrar "Continuar" vs "Dictar"
                    let hasContent = false;
                    if (fieldName.includes('operario-')) {
                        const [, index, field] = fieldName.split('-');
                        const operarioIndex = parseInt(index);
                        hasContent = formData.operarios[operarioIndex]?.[field]?.trim().length > 0;
                    } else {
                        hasContent = formData[fieldName]?.trim().length > 0;
                    }

                    return hasContent ? '🎤 Continuar' : '🎤 Dictar';
                };

                const getTitle = () => {
                    if (isActiveField) {
                        return 'Parar dictado';
                    }

                    let hasContent = false;

                                                    setShowSettings(false);
                                                }}
                                                className="w-full px-4 py-3 bg-green-600 text-white rounded-lg hover:bg-green-700 text-sm sm:text-base"
                                            >
                                                💾 Guardar Configuración
                                            </button>
                                        </div>
                                    </div>

                                    {/* Información */}
                                    <div className="bg-blue-50 p-4 rounded-lg border border-blue-200">
                                        <h4 className="font-semibold text-blue-800 mb-2">ℹ️ Cómo funciona</h4>
                                        <ul className="text-sm text-blue-700 space-y-1">
                                            <li>• <strong>Email:</strong> Se abre tu app de email con el parte listo</li>
                                            <li>• <strong>WhatsApp:</strong> Se abre WhatsApp con el resumen preparado</li>
                                            <li>• <strong>PDF:</strong> Se descarga automáticamente para adjuntar</li>
                                            <li>• <strong>Offline:</strong> Funciona sin internet, sincroniza después</li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal de Historial */}
                    {showHistory && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-2 sm:p-4 z-50">
                            <div className="bg-white rounded-lg max-w-4xl w-full max-h-[90vh] overflow-y-auto">
                                <div className="p-4 sm:p-6 border-b">
                                    <div className="flex justify-between items-center">
                                        <h3 className="text-lg sm:text-xl font-bold text-blue-700">📚 Historial de Partes</h3>
                                        <button
                                            onClick={() => setShowHistory(false)}
                                            className="px-3 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200"
                                        >
                                            ❌
                                        </button>
                                    </div>
                                </div>

                                <div className="p-4 sm:p-6">
                                    {partesHistory.length === 0 ? (
                                        <div className="text-center py-8">
                                            <p className="text-gray-500">No hay partes guardados en el historial</p>
                                        </div>
                                    ) : (
                                        <div className="space-y-4">
                                            {partesHistory.map((parte, index) => (
                                                <div key={parte.id} className="border rounded-lg p-4 bg-gray-50">
                                                    <div className="flex justify-between items-start mb-2">
                                                        <h4 className="font-semibold text-lg">{parte.nombreTrabajo}</h4>
                                                        <span className="text-xs text-gray-500">
                                                            {new Date(parte.fechaCreacion).toLocaleDateString('es-ES')}
                                                        </span>
                                                    </div>

                                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 text-sm mt-3">
                                                        <div>
                                                            <span className="font-medium">Horas:</span> {parte.operarios.reduce((sum, op) => sum + (parseFloat(op.horas) || 0), 0)}h
                                                        </div>
                                                        <div>
                                                            <span className="font-medium">Operarios:</span> {parte.operarios.length}
                                                        </div>
                                                        <div>
                                                            <span className="font-medium">Imágenes:</span> {parte.imagenes?.length || 0}
                                                        </div>
                                                        <div>
                                                            <span className="font-medium">Fecha:</span> {parte.fecha}
                                                        </div>
                                                    </div>

                                                    <div className="mt-3 flex gap-2">
                                                        <button
                                                            onClick={() => {
                                                                setFormData(parte);
                                                                setShowHistory(false);
                                                                setCurrentStep(0);
                                                            }}
                                                            className="px-3 py-1 bg-blue-100 text-blue-700 rounded-lg hover:bg-blue-200 text-sm"
                                                        >
                                                            👁️ Ver/Editar
                                                        </button>
                                                        <button
                                                            onClick={() => {
                                                                const template = {
                                                                    ...parte,
                                                                    id: 'parte_' + Date.now(),
                                                                    fecha: new Date().toISOString().split('T')[0],
                                                                    imagenes: [],
                                                                    albaranes: [],
                                                                    resumenInteligente: ''
                                                                };
                                                                setFormData(template);
                                                                setShowHistory(false);
                                                                setCurrentStep(0);
                                                            }}
                                                            className="px-3 py-1 bg-green-100 text-green-700 rounded-lg hover:bg-green-200 text-sm"
                                                        >
                                                            📋 Usar como plantilla
                                                        </button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.render(<PartesDiarioApp />, document.getElementById('root'));
    </script>
</body>
</html>
